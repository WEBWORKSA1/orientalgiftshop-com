# Self-updating news: refreshes assets/data/news.json every day from public
# Google News RSS searches and commits it, which republishes the site.
# To activate: in GitHub, Add file > Create new file > name it
# .github/workflows/update-news.yml and paste this file's contents.
name: Update gifting news

on:
  schedule:
    - cron: "23 5 * * *"   # daily, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch news
        run: python3 automation/fetch_news.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/news.json
          git diff --cached --quiet || (git commit -m "Daily gifting news update" && git push)
